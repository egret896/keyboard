# GitHub が自動で APK を組み立てる設定。
#   main にプッシュ → mozc（漢字変換）をビルド → APK を作る → 「Releases」に置く
name: APKを作る

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NDK_VERSION: 27.2.12479018
      # AI変換（Zenzai）のモデル（約99MB）を入れるか。使わないので外して軽くする。
      # 入れたくなったら "true" にする
      BUNDLE_ZENZAI: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: ディスクの空きを増やす
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Android NDK を入れる
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: bazel のキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ hashFiles('scripts/build_mozc.sh', 'patches/**') }}
          restore-keys: bazel-

      - name: mozc のソースを取ってくる
        run: |
          MOZC_COMMIT=$(grep -oP 'MOZC_COMMIT="\K[0-9a-f]+' scripts/build_mozc.sh)
          mkdir -p third_party/mozc
          cd third_party/mozc
          git init
          git remote add origin https://github.com/google/mozc.git
          git fetch --depth 1 origin "$MOZC_COMMIT"
          git checkout FETCH_HEAD
          ls src | head

      - name: 辞書を取ってくる
        run: ./scripts/fetch_dictionaries.sh
        env:
          # JMdict を GitHub のリリース（jmdict-simplified）から取るため
          GH_TOKEN: ${{ github.token }}

      - name: bazelisk（ビルド道具）を入れる
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/bazelisk" https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "$HOME/bin/bazelisk"
          echo "BAZEL=$HOME/bin/bazelisk" >> "$GITHUB_ENV"
          "$HOME/bin/bazelisk" version || true

      - name: mozc（漢字変換エンジン）をビルド
        run: bash -x ./scripts/build_mozc.sh 2>&1 | grep -v '^+ \[\[' ; exit ${PIPESTATUS[0]}

      - name: 変換の診断（コミットメッセージに [diag] があるときだけ）
        if: contains(github.event.head_commit.message, '[diag]')
        continue-on-error: true
        working-directory: third_party/mozc/src
        run: |
          "$BAZEL" build //converter:converter_main //session:session_handler_main \
            --config oss_linux --config release_build --curses=no > /tmp/diag_build.log 2>&1 || tail -40 /tmp/diag_build.log
          echo "=== converter_main ==="
          printf '%s\n' 'start あとよそくへんかんが' 'start よそくへんかん' 'start どうにかならんの' > /tmp/q.txt
          ./bazel-bin/converter/converter_main --engine_name=oss --engine_type=mobile \
            --engine_data_path="$PWD/bazel-bin/data_manager/oss/mozc.data" \
            --max_candidates_to_show=4 < /tmp/q.txt 2>/dev/null | grep -E '^(-----|[^ ]|  [0-9]+/)' | head -120
          echo "=== session_handler_main (app-like flick input) ==="
          mkdir -p /tmp/prof
          ./bazel-bin/session/session_handler_main \
            --input="$GITHUB_WORKSPACE/scripts/diag/flick_scenario.tsv" \
            --dictionary=oss --profile=/tmp/prof 2>/dev/null | head -400
          echo "=== end diag ==="

      - name: キー配置を作る
        run: |
          python3 scripts/gen_flick_layout.py
          python3 scripts/gen_qwerty_layout.py

      - name: AI変換エンジン（Zenzai）を準備
        id: zenzai
        if: env.BUNDLE_ZENZAI == 'true'
        continue-on-error: true
        run: |
          ./scripts/fetch_zenzai_public.sh
          cmake -S native/zenzai -B build/zenzai-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DZINNA_LLAMA_SOURCE="$PWD/third_party/zenzai-llama" -DZINNA_TTT_STUB=ON
          cmake --build build/zenzai-android --parallel 4
          mkdir -p app/src/zenzai/jniLibs/arm64-v8a
          cp build/zenzai-android/libzinna_zenzai.so app/src/zenzai/jniLibs/arm64-v8a/
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: 専用の署名鍵を金庫から取り出す
        env:
          KK_SIGNING: ${{ secrets.KK_SIGNING }}
        run: |
          # 金庫の中身は「パスワード:鍵(base64)」。ログには出さない
          if [ -n "$KK_SIGNING" ]; then
            mkdir -p signing
            printf '%s' "${KK_SIGNING#*:}" | base64 -d > signing/private.p12
            PW="${KK_SIGNING%%:*}"
            echo "::add-mask::$PW"
            echo "KK_SIGNING_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "専用の鍵で署名します"
          else
            echo "::warning::金庫(KK_SIGNING)が空なので、公開の練習用の鍵で署名します"
          fi

      - name: APK をビルド
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Zenzai の準備に成功したときだけ同梱する（失敗してもふつうのAPKは作る）
          if [ "${{ steps.zenzai.outputs.ok }}" = "true" ]; then ZENZAI="-Pzenzai=true"; else ZENZAI=""; echo "AI変換（Zenzai）なしで組み立てます"; fi
          ./gradlew :app:assembleDebug --no-daemon $ZENZAI
          mkdir -p dist
          ls app/build/outputs/apk/debug/
          # Fold7 は arm64。ABIごとに分かれた APK から arm64 版を選ぶ
          cp "$(ls app/build/outputs/apk/debug/*arm64*.apk | head -1)" dist/my-keyboard.apk
          ls -la dist
          # 署名がいつもの鍵か確認（違うと上書きインストールできない）
          #   専用の鍵      c63802375a…  （金庫 KK_SIGNING があるとき）
          #   練習用の鍵    e2489b354b…  （金庫が空のとき）
          CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/my-keyboard.apk)"
          if [ -f signing/private.p12 ]; then
            echo "$CERTS" | grep -i "c63802375ae785562b91d7b4d7a8302bed90618a1ec84c780882ef142b718003"
          else
            echo "$CERTS" | grep -i "e2489b354b7a88d07072cd661a8ef89bdc49017de133044b5089f1240f05d655"
          fi
          rm -f signing/private.p12

      - uses: actions/upload-artifact@v4
        with:
          name: my-keyboard-apk
          path: dist/my-keyboard.apk

      - name: Releases に置く（スマホからダウンロードできる場所）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/my-keyboard.apk \
            --title "最新版 ($(date -u +%Y-%m-%d))" \
            --notes "この my-keyboard.apk をスマホでダウンロードしてインストールしてください。" \
            --target "${GITHUB_SHA}"
